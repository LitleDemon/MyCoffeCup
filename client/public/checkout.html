<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оформление заказа — MyCoffeCup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a href="/index.html" class="logo">My<span>Coffe</span>Cup</a>
      <nav class="nav" aria-label="Основная навигация">
        <a href="/index.html">Каталог</a>
        <a href="/profile.html">Мои заказы</a>
        <a href="/blog.html">Блог</a>
        <a href="/#about">О нас</a>
        <a href="/#contacts">Контакты</a>
      </nav>
      <div class="header-actions">
        <a href="/cart.html" class="btn btn--ghost" aria-label="Корзина">
          🛒 <span class="cart-count badge badge--new" data-cart-count>0</span>
        </a>
        <a href="/login.html" class="btn btn--secondary" data-auth-link>Войти</a>
        <button class="btn btn--ghost burger" aria-label="Меню" data-burger>☰</button>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <h1>Оформление заказа</h1>
      <p class="text-muted" style="margin-bottom: var(--sp-5);">
        Проверьте состав заказа и выберите способ оплаты.
      </p>

      <div class="checkout-layout">
        <!-- Состав заказа -->
        <div>
          <div class="panel">
            <h3>Состав заказа</h3>
            <div data-checkout-items></div>
          </div>
        </div>

        <!-- Оплата и итог -->
        <aside class="cart-summary">
          <h3>Оплата</h3>

          <div class="payment-options">
            <label class="payment-option">
              <input type="radio" name="payment_method" value="online" checked>
              <div class="payment-option__body">
                <strong>Онлайн картой</strong>
                <span class="text-muted">Оплата сейчас, заказ сразу в работу</span>
              </div>
            </label>
            <label class="payment-option">
              <input type="radio" name="payment_method" value="onsite">
              <div class="payment-option__body">
                <strong>На месте</strong>
                <span class="text-muted">Оплата при получении в кофейне</span>
              </div>
            </label>
          </div>

          <div class="row row--between" style="padding: var(--sp-2) 0; border-top: 1px solid var(--color-border);">
            <span class="text-muted">Товаров</span>
            <span data-checkout-count>0</span>
          </div>
          <div class="row row--between" style="padding: var(--sp-2) 0;">
            <strong>Итого</strong>
            <strong class="price" data-checkout-total>0 ₽</strong>
          </div>

          <button type="button" class="btn btn--primary btn--block" style="margin-top: var(--sp-3);" data-submit-order>
            Оформить заказ
          </button>
          <a href="/cart.html" class="btn btn--ghost btn--block" style="margin-top: var(--sp-2);">
            ← Назад в корзину
          </a>
        </aside>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container text-muted" style="padding: var(--sp-5) 0;">
      © <span data-current-year></span> MyCoffeCup
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/checkout.js"></script>
</body>
</html>
