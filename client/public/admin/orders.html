<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админка — Заказы</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-body">

  <aside class="admin-sidebar">
    <a href="/index.html" class="logo">My<span>Coffe</span>Cup</a>
    <nav class="admin-nav">
      <a href="/admin/dashboard.html">📊 Статистика</a>
      <a href="/admin/products.html">☕ Товары</a>
      <a href="/admin/toppings.html">🍯 Топпинги</a>
      <a href="/admin/content.html">📝 Контент</a>
      <a href="/admin/orders.html" aria-current="page">🧾 Заказы</a>
      <a href="/index.html">← На сайт</a>
    </nav>
  </aside>

  <main class="admin-main">
    <header class="admin-header">
      <h1>Заказы</h1>
      <select class="select" style="max-width: 220px;" data-status-filter>
        <option value="">Все статусы</option>
        <option value="new">Новые</option>
        <option value="paid">Оплачены</option>
        <option value="done">Выполнены</option>
        <option value="cancelled">Отменены</option>
      </select>
    </header>

    <section class="panel">
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>№</th>
              <th>Клиент</th>
              <th>Сумма</th>
              <th>Статус</th>
              <th>Дата</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody data-orders-table>
            <tr><td colspan="6" class="text-muted">Загрузка…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

<script src="/js/api.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
