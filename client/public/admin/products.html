<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админка — Товары</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-body">

  <aside class="admin-sidebar">
    <a href="/index.html" class="logo">My<span>Coffe</span>Cup</a>
    <nav class="admin-nav">
      <a href="/admin/dashboard.html">📊 Статистика</a>
      <a href="/admin/products.html" aria-current="page">☕ Товары</a>
      <a href="/admin/content.html">📝 Контент</a>
      <a href="/admin/orders.html">🧾 Заказы</a>
      <a href="/index.html">← На сайт</a>
    </nav>
  </aside>

  <main class="admin-main">
    <header class="admin-header">
      <h1>Управление товарами</h1>
      <button class="btn btn--primary" data-open-product-modal>+ Добавить товар</button>
    </header>

    <section class="panel">
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Название</th>
              <th>Категория</th>
              <th>Цена</th>
              <th>Остаток</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody data-products-table>
            <tr><td colspan="6" class="text-muted">Загрузка…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Модалка создания/редактирования товара -->
  <div class="modal" data-product-modal hidden>
    <div class="modal__overlay" data-close-modal></div>
    <div class="modal__content" role="dialog" aria-modal="true" aria-labelledby="product-modal-title">
      <header class="modal__header">
        <h3 id="product-modal-title" data-modal-title>Новый товар</h3>
        <button class="btn btn--ghost" data-close-modal aria-label="Закрыть">✕</button>
      </header>
      <form class="form" data-product-form>
        <input type="hidden" name="id">
        <div class="field">
          <label class="field__label" for="p-name">Название</label>
          <input class="input" type="text" id="p-name" name="name" required>
        </div>
        <div class="field">
          <label class="field__label" for="p-category">Категория</label>
          <select class="select" id="p-category" name="category" required>
            <option value="coffee">Кофе</option>
            <option value="tea">Чай</option>
            <option value="dessert">Десерт</option>
          </select>
        </div>
        <div class="row">
          <div class="field" style="flex: 1;">
            <label class="field__label" for="p-price">Цена, ₽</label>
            <input class="input" type="number" id="p-price" name="price" min="0" required>
          </div>
          <div class="field" style="flex: 1;">
            <label class="field__label" for="p-stock">Остаток</label>
            <input class="input" type="number" id="p-stock" name="stock" min="0" required>
          </div>
        </div>
        <div class="field">
          <label class="field__label" for="p-image">URL изображения</label>
          <input class="input" type="text" id="p-image" name="image_url" placeholder="/images/latte.jpg">
        </div>
        <div class="field">
          <label class="field__label" for="p-desc">Описание</label>
          <textarea class="textarea" id="p-desc" name="description"></textarea>
        </div>
        <p class="field__error" data-error hidden></p>
        <div class="row" style="justify-content: flex-end;">
          <button type="button" class="btn btn--secondary" data-close-modal>Отмена</button>
          <button type="submit" class="btn btn--primary">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

<script src="/js/api.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
