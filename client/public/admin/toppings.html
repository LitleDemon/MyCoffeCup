<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админка — Топпинги</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-body">

  <aside class="admin-sidebar">
    <a href="/index.html" class="logo">My<span>Coffe</span>Cup</a>
    <nav class="admin-nav">
      <a href="/admin/dashboard.html">📊 Статистика</a>
      <a href="/admin/products.html">☕ Товары</a>
      <a href="/admin/toppings.html" aria-current="page">🍯 Топпинги</a>
      <a href="/admin/content.html">📝 Контент</a>
      <a href="/admin/orders.html">🧾 Заказы</a>
      <a href="/index.html">← На сайт</a>
    </nav>
  </aside>

  <main class="admin-main">
    <header class="admin-header">
      <h1>Топпинги и сиропы</h1>
      <button class="btn btn--primary" data-open-topping-modal>+ Добавить топпинг</button>
    </header>

    <section class="panel">
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Название</th>
              <th>Тип</th>
              <th>Цена</th>
              <th>Статус</th>
              <th>Сезон</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody data-toppings-table>
            <tr><td colspan="7" class="text-muted">Загрузка…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="modal" data-topping-modal hidden>
    <div class="modal__overlay" data-close-modal></div>
    <div class="modal__content" role="dialog" aria-modal="true" aria-labelledby="topping-modal-title">
      <header class="modal__header">
        <h3 id="topping-modal-title" data-modal-title>Новый топпинг</h3>
        <button class="btn btn--ghost" data-close-modal aria-label="Закрыть">✕</button>
      </header>

      <form class="form" data-topping-form>
        <input type="hidden" name="id">

        <div class="field">
          <label class="field__label" for="t-name">Название</label>
          <input class="input" type="text" id="t-name" name="name" required>
        </div>

        <div class="row">
          <div class="field" style="flex: 1;">
            <label class="field__label" for="t-type">Тип</label>
            <select class="select" id="t-type" name="type" required>
              <option value="syrup">Сироп</option>
              <option value="topping">Топпинг</option>
            </select>
          </div>
          <div class="field" style="flex: 1;">
            <label class="field__label" for="t-price">Цена, ₽</label>
            <input class="input" type="number" id="t-price" name="price" min="0" step="0.01" required>
          </div>
        </div>

        <div class="row" style="gap: var(--sp-4);">
          <label class="checkbox">
            <input type="checkbox" name="is_active" checked>
            <span>Активен (виден пользователям)</span>
          </label>
          <label class="checkbox">
            <input type="checkbox" name="is_seasonal" data-is-seasonal>
            <span>Сезонный</span>
          </label>
        </div>

        <div class="field" data-expires-field hidden>
          <label class="field__label" for="t-expires">Действует до</label>
          <input class="input" type="date" id="t-expires" name="expires_at">
          <span class="field__hint">После этой даты топпинг автоматически скроется у пользователей.</span>
        </div>

        <p class="field__error" data-error hidden></p>

        <div class="row" style="justify-content: flex-end;">
          <button type="button" class="btn btn--secondary" data-close-modal>Отмена</button>
          <button type="submit" class="btn btn--primary">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
