<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админка — Контент</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-body">

  <aside class="admin-sidebar">
    <a href="/index.html" class="logo">My<span>Coffe</span>Cup</a>
    <nav class="admin-nav">
      <a href="/admin/dashboard.html">📊 Статистика</a>
      <a href="/admin/products.html">☕ Товары</a>
      <a href="/admin/content.html" aria-current="page">📝 Контент</a>
      <a href="/admin/orders.html">🧾 Заказы</a>
      <a href="/index.html">← На сайт</a>
    </nav>
  </aside>

  <main class="admin-main">
    <header class="admin-header">
      <h1>Управление блогом</h1>
      <button class="btn btn--primary" data-open-post-modal>+ Новая статья</button>
    </header>

    <section class="panel">
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Заголовок</th>
              <th>Дата</th>
              <th>Автор</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody data-posts-table>
            <tr><td colspan="5" class="text-muted">Загрузка…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="modal" data-post-modal hidden>
    <div class="modal__overlay" data-close-modal></div>
    <div class="modal__content" role="dialog" aria-modal="true">
      <header class="modal__header">
        <h3 data-modal-title>Новая статья</h3>
        <button class="btn btn--ghost" data-close-modal aria-label="Закрыть">✕</button>
      </header>
      <form class="form" data-post-form>
        <input type="hidden" name="id">
        <div class="field">
          <label class="field__label" for="post-title">Заголовок</label>
          <input class="input" type="text" id="post-title" name="title" required>
        </div>
        <div class="field">
          <label class="field__label" for="post-excerpt">Краткое описание</label>
          <textarea class="textarea" id="post-excerpt" name="excerpt" maxlength="200"></textarea>
        </div>
        <div class="field">
          <label class="field__label" for="post-image">Обложка (URL)</label>
          <input class="input" type="text" id="post-image" name="cover_url">
        </div>
        <div class="field">
          <label class="field__label" for="post-body">Текст статьи</label>
          <textarea class="textarea" id="post-body" name="body" rows="8" required></textarea>
        </div>
        <p class="field__error" data-error hidden></p>
        <div class="row" style="justify-content: flex-end;">
          <button type="button" class="btn btn--secondary" data-close-modal>Отмена</button>
          <button type="submit" class="btn btn--primary">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

<script src="/js/api.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
