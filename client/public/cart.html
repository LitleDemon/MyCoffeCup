<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Корзина — MyCoffeCup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a href="/index.html" class="logo">My<span>Coffe</span>Cup</a>
      <nav class="nav" aria-label="Основная навигация">
        <a href="/index.html">Каталог</a>
        <a href="/blog.html">Блог</a>
        <a href="/#about">О нас</a>
        <a href="/#contacts">Контакты</a>
      </nav>
      <div class="header-actions">
        <a href="/cart.html" class="btn btn--ghost" aria-label="Корзина">
          🛒 <span class="cart-count badge badge--new" data-cart-count>0</span>
        </a>
        <a href="/login.html" class="btn btn--secondary" data-auth-link>Войти</a>
        <button class="btn btn--ghost burger" aria-label="Меню" data-burger>☰</button>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <h1>Корзина</h1>

      <div class="cart-layout">
        <div>
          <div data-cart-items></div>

          <div class="text-center" data-cart-empty hidden>
            <p class="text-muted">Ваша корзина пока пуста.</p>
            <a href="/index.html" class="btn btn--primary">Перейти в каталог</a>
          </div>

          <details class="stickers-section">
            <summary>🎨 Украсить открытку к заказу</summary>
            <div class="stickers-editor">
              <div class="stickers-canvas" data-stickers-canvas>
                <span class="stickers-placeholder text-muted">Перетащите стикеры сюда 👇</span>
              </div>

              <div class="stickers-controls" data-stickers-controls hidden>
                <label class="stickers-controls__row">
                  <span>Размер</span>
                  <input type="range" min="0.5" max="3" step="0.1" value="1" data-control-scale>
                  <span class="stickers-controls__value" data-control-scale-value>1.0</span>
                </label>
                <label class="stickers-controls__row">
                  <span>Поворот</span>
                  <input type="range" min="0" max="360" step="1" value="0" data-control-rotate>
                  <span class="stickers-controls__value" data-control-rotate-value>0°</span>
                </label>
                <button type="button" class="btn btn--danger btn--block" data-control-delete>
                  Удалить элемент
                </button>
              </div>

              <div class="stickers-palette" data-stickers-palette></div>

              <div class="stickers-text-row">
                <input type="text" class="input" placeholder="Текст на открытке" maxlength="60" data-stickers-text>
                <button type="button" class="btn btn--secondary" data-stickers-add-text>Добавить</button>
              </div>

              <div class="row" style="justify-content: flex-end;">
                <button type="button" class="btn btn--ghost" data-stickers-clear>Очистить</button>
              </div>
            </div>
          </details>
        </div>

        <aside class="cart-summary">
          <h3>Итого</h3>
          <div class="row row--between" style="padding: var(--sp-2) 0;">
            <span class="text-muted">Товаров</span>
            <span data-cart-total-count>0</span>
          </div>
          <div class="row row--between" style="padding: var(--sp-2) 0; border-top: 1px solid var(--color-border);">
            <strong>Сумма</strong>
            <strong class="price" data-cart-total-price>0 ₽</strong>
          </div>
          <button type="button" class="btn btn--primary btn--block" style="margin-top: var(--sp-3);" data-checkout>
            Оформить заказ
          </button>
          <a href="/index.html" class="btn btn--ghost btn--block" style="margin-top: var(--sp-2);">
            Продолжить покупки
          </a>
        </aside>
      </div>
    </div>
  </main>

  <!-- Модалка редактирования позиции -->
  <div class="modal" data-edit-modal hidden>
    <div class="modal__overlay" data-close-edit-modal></div>
    <div class="modal__content" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
      <header class="modal__header">
        <h3 id="edit-modal-title" data-edit-modal-title>Изменить позицию</h3>
        <button class="btn btn--ghost" data-close-edit-modal aria-label="Закрыть">✕</button>
      </header>

      <form data-edit-form>
        <div class="field" data-edit-sizes-field></div>
        <div class="field" data-edit-toppings-field></div>

        <div class="product-detail__total">
          <span class="text-muted">Цена за 1 шт:</span>
          <strong class="price" data-edit-price>0 ₽</strong>
        </div>

        <div class="row" style="justify-content: flex-end; margin-top: var(--sp-3);">
          <button type="button" class="btn btn--secondary" data-close-edit-modal>Отмена</button>
          <button type="submit" class="btn btn--primary">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container text-muted" style="padding: var(--sp-5) 0;">
      © <span data-current-year></span> MyCoffeCup
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/stickers.js"></script>
</body>
</html>
