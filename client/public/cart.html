<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Корзина — MyCoffeCup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a href="/index.html" class="logo">My<span>Coffe</span>Cup</a>
      <nav class="nav" aria-label="Основная навигация">
        <a href="/index.html">Каталог</a>
        <a href="/blog.html">Блог</a>
        <a href="/#about">О нас</a>
        <a href="/#contacts">Контакты</a>
      </nav>
      <div class="header-actions">
        <a href="/cart.html" class="btn btn--ghost" aria-label="Корзина">
          🛒 <span class="cart-count badge badge--new" data-cart-count>0</span>
        </a>
        <a href="/login.html" class="btn btn--secondary" data-auth-link>Войти</a>
        <button class="btn btn--ghost burger" aria-label="Меню" data-burger>☰</button>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <h1>Корзина</h1>

      <div class="cart-layout" style="display: grid; grid-template-columns: 1fr 340px; gap: var(--sp-5); align-items: start;">

        <!-- Список товаров -->
        <div>
          <div data-cart-items>
            <!-- Корзина рендерится cart.js -->
            <p class="text-muted">Загрузка…</p>
          </div>

          <div class="text-center" data-cart-empty hidden>
            <p class="text-muted">Ваша корзина пока пуста.</p>
            <a href="/index.html" class="btn btn--primary">Перейти в каталог</a>
          </div>
        </div>

        <!-- Итого + оформление -->
        <aside class="cart-summary" style="background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--sp-4); position: sticky; top: 90px;">
          <h3>Итого</h3>
          <div class="row row--between" style="padding: var(--sp-2) 0;">
            <span class="text-muted">Товаров</span>
            <span data-cart-total-count>0</span>
          </div>
          <div class="row row--between" style="padding: var(--sp-2) 0; border-top: 1px solid var(--color-border);">
            <strong>Сумма</strong>
            <strong class="price" data-cart-total-price>0 ₽</strong>
          </div>
          <a href="/checkout.html" class="btn btn--primary btn--block" style="margin-top: var(--sp-3);">
            Оформить заказ
          </a>
          <a href="/index.html" class="btn btn--ghost btn--block" style="margin-top: var(--sp-2);">
            Продолжить покупки
          </a>
        </aside>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container text-muted" style="padding: var(--sp-5) 0;">
      © <span data-current-year></span> MyCoffeCup
    </div>
  </footer>

  <script src="/js/header.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/cart.js"></script>
</body>
</html>
